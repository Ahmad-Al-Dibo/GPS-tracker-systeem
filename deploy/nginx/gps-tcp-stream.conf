# GPS Tracking Platform — Nginx stream (TCP) voor de Teltonika AVL-poort
# Plaats in /etc/nginx/nginx.conf binnen het `stream { }` blok, of als
# /etc/nginx/conf.d/gps-tcp-stream.conf met eigen stream-blok.
#
# Doel: de GPS TCP-poort onafhankelijk van HTTP/HTTPS exposeren, met
# connection limiting en logging. De payload blijft Teltonika-AVL (optioneel
# TLS-terminated op de node-server zelf — zie DEPLOYMENT.md "Network security").

stream {
    log_format gps_tcp '$remote_addr [$time_local] '
                       'upstream=$upstream_bytes_received/$upstream_bytes_sent '
                       'status=$status connect=$upstream_connect_time';
    access_log /var/log/nginx/gps-tcp.log gps_tcp;

    # Rate/beperking: max. verbindingen per IP (70 devices globaal)
    limit_conn_zone $binary_remote_addr zone=gps_conn:10m;

    upstream gps_avl_backend {
        server 127.0.0.1:5027;   # teltonika/server.mjs (GPS_TCP_PORT)
    }

    server {
        listen 5556;             # publieke GPS-poort (firewall: deze poort open)
        proxy_pass gps_avl_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;        # lange sessies; laat keepalive van het device werken
        limit_conn gps_conn 8;   # max. 8 gelijktijdige verbindingen per IP
    }
}

# Firewall (ufw):
#   ufw allow 443/tcp
#   ufw allow 5556/tcp comment 'Teltonika AVL'
#   ufw allow 22/tcp
# PostgreSQL (5432) NIET publiek openen.
