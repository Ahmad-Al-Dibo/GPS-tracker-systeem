# GPS Tracking Platform — Nginx HTTPS reverse proxy
# Plaats als /etc/nginx/sites-available/gps-tracking en symlink naar sites-enabled.
# Vereist certificaten (bv. certbot: certbot --nginx -d gps.example.com).
#
# LET OP: de GPS TCP-poort is NIET dit bestand — zie gps-tcp-stream.conf.

upstream gps_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name gps.example.com;
    # HTTPS-afdwinging
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gps.example.com;

    ssl_certificate     /etc/letsencrypt/live/gps.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gps.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Upload-limiet voor eventuele imports
    client_max_body_size 16m;

    # Health-checks zonder caching
    location /api/health {
        proxy_pass http://gps_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://gps_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
