# GPS Tracking Platform — autonivo.nl (fase 3: HTTP + ACME + proxy)
# Fase 5 (certbot) voegt HTTPS/443 en de HTTP→HTTPS-redirect toe.
# Bestaande site /etc/nginx/sites-available/default blijft ongewijzigd.
#
# Let op: proxy_pass → 127.0.0.1:3000 (app wordt in fase 4 lokaal gebonden).

server {
    listen 80;
    listen [::]:80;
    server_name autonivo.nl www.autonivo.nl;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Oorspronkelijke client en protocol doorgeven (cookies/secure gedrag)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket-upgrades (HMR/push-toepassingen)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Upload-limiet (bulk-import in de app)
        client_max_body_size 16m;
    }
}
