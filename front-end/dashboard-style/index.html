<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard pagina</title>
</head>
<body>

    <div class="dashboard">

        <nav>
            <div class="logo">
                <img src="./assets/Glanzend-GPS-Manager-logo-met-satelliet.png" alt="GPS manager logo">
            </div>

            <div class="routes">

                <!-- Dit is een link voorbeeld in een Minue -->
                <div class="route active">
                    <div class="route-left">
                        <i data-lucide="layout-dashboard"></i>  
                        <p>Dashboard</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="car-front"></i>  
                        <p>Voertuigen</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="users-round"></i>  
                        <p>Personen</p>
                    </div>
                    

                    <div class="route-left">
                        <i data-lucide="radio"></i>  
                        <p>Trackers</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="key-round"></i>  
                        <p>API Keys</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="map"></i>  
                        <p>Kaar</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="history"></i>  
                        <p>Historie</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="list-checks"></i>  
                        <p>Regels</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="bell"></i>  
                        <p>Alerts</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="fence"></i>  
                        <p>Geofences</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="route"></i>  
                        <p>Locaties & Routes</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="clipboard-list"></i>  
                        <p>Taken</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="chart-no-axes-column-increasing"></i>  
                        <p>Rapporten</p>
                    </div>

                    <div class="route-left">
                        <i data-lucide="trash-2"></i>  
                        <p>Prullenbak</p>
                    </div>
                </div>

            </div>

            <div class="profiel-info">

                <div>
                     <i data-lucide="user-round"></i>  
                </div>

                <div>
                    <h4>Admin</h4>
                    <p>Beheer</p>
                </div>
            </div>
        </nav>

        <main>
            <!-- Komt later. Eerste minue -->
        </main>
    </div>

<script src="https://unpkg.com/lucide@latest"></script>

<script>
    lucide.createIcons();
</script>

</body>
</html>
